<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagarakanti Family Tree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- ============================================
         SECTION 1: STYLES (Global + Tree Layout)
         ============================================ -->
    <style>
        /* --- Core Theme --- */
        body {
            background-color: #030014;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body::-webkit-scrollbar {
            display: none;
        }

        /* --- Tree Structure --- */
        .tree {
            position: relative;
            z-index: 10;
        }

        .tree ul, .tree li {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .tree ul {
            display: flex;
            justify-content: center;
            position: relative;
            padding-top: 40px;
            transition: all 0.4s ease;
        }
        .tree > ul { padding-top: 0; }

        .tree li {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 40px 1rem 0 1rem;
        }
        .tree > ul > li { padding-top: 0; }

        /* --- Connectors: Horizontal Lines --- */
        .tree li::before, .tree li::after {
            content: '';
            position: absolute;
            top: 0;
            width: 50%;
            height: 2px;
            background-color: #475569;
            z-index: -2;
        }
        .tree li::before { left: 0; }
        .tree li::after { right: 0; }

        .tree li:only-child::before, .tree li:only-child::after { display: none; }
        .tree li:first-child::before { display: none; }
        .tree li:last-child::after { display: none; }

        /* --- Connectors: Vertical Lines --- */
        .tree li > .family-unit::before {
            content: '';
            position: absolute;
            top: -40px;
            left: calc(50% - 1px);
            width: 2px;
            height: 40px;
            background-color: #475569;
            z-index: -2;
        }
        .tree > ul > li > .family-unit::before { display: none !important; }

        .tree ul ul::before {
            content: '';
            position: absolute;
            top: 0;
            left: calc(50% - 1px);
            width: 2px;
            height: 40px;
            background-color: #475569;
            z-index: -2;
        }

        /* --- Utility Classes --- */
        .hidden-tree {
            display: none !important;
        }

        /* --- Card Hover Effect --- */
        .person-card {
            transition: all 0.3s ease;
        }
        .person-card:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* --- Modal Backdrop --- */
        #modal.modal-open {
            display: flex !important;
        }
    </style>
</head>
<body class="overflow-x-auto overflow-y-auto">

    <!-- ============================================
         SECTION 2: BACKGROUND ELEMENTS
         ============================================ -->
    <div class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-blue-900/20 blur-[120px] pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-purple-900/20 blur-[120px] pointer-events-none z-0"></div>

    <!-- ============================================
         SECTION 3: HEADER
         ============================================ -->
    <div class="w-max min-w-full mx-auto pt-10 pb-32 px-12 relative z-10 flex flex-col items-center">
        <div class="text-center mb-16">
            <h2 class="text-cyan-400 text-[10px] font-bold tracking-[0.3em] uppercase mb-2">Lineage & Legacy</h2>
            <h1 class="text-3xl md:text-4xl font-bold text-white tracking-tight">Nagarakanti Family</h1>
            <p class="text-slate-400 mt-2 text-xs leading-relaxed">
                Click on any family member to view their information.
            </p>
        </div>

        <!-- ============================================
             SECTION 4: TREE CONTAINER (Rendered via JS)
             ============================================ -->
        <div class="tree" id="tree-root"></div>
    </div>

    <!-- ============================================
         SECTION 5: MODAL
         ============================================ -->
    <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm transition-opacity">
        <div class="bg-[#030014] border border-white/10 rounded-xl p-8 max-w-sm w-full mx-4 shadow-2xl relative flex flex-col items-center">
            <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full flex items-center justify-center bg-white/5 text-slate-400 hover:text-white hover:bg-white/10 transition-colors cursor-pointer">
                <span class="text-lg">✕</span>
            </button>
            <h3 id="modal-name" class="text-xl font-bold text-white mb-2 text-center mt-2">Name</h3>
            <div class="w-12 h-[2px] bg-cyan-500 mb-4 rounded-full opacity-75"></div>
            <p id="modal-description" class="text-slate-400 text-sm text-center leading-relaxed">Add description here...</p>
        </div>
    </div>

    <!-- ============================================
         SECTION 6: DATA & RENDERING LOGIC
         ============================================ -->
    <script>
        // ========== 6.1: FAMILY DATA ==========
        // Organized hierarchically for easy updates
        const familyData = {
            name: "N P Rangiah Shetty",
            role: "Husband",
            spouse: "N Varalakshamma",
            spouseRole: "Wife",
            description: "Patriarch of the Nagarakanti family",
            children: [
                {
                    name: "N Ranganath Gupta",
                    role: "1st Son",
                    spouse: "N Sathyavathi",
                    spouseRole: "Wife",
                    description: "First son of N P Rangiah Shetty",
                    children: [
                        { name: "Kiranmai Ragalatha", role: "1st Daughter", description: "First daughter of Ranganath" },
                        { name: "Rajeev Chandra", role: "1st Son", description: "First son of Ranganath" }
                    ]
                },
                {
                    name: "N Rama Krishna",
                    role: "2nd Son",
                    spouse: "Kalpana",
                    spouseRole: "Wife",
                    description: "Second son of N P Rangiah Shetty",
                    children: [
                        { name: "Nilima Dhavala", role: "1st Daughter", description: "First daughter of Rama Krishna" },
                        { name: "Rakhi", role: "2nd Daughter", description: "Second daughter of Rama Krishna" }
                    ]
                },
                {
                    name: "N Ravindranath",
                    role: "3rd Son",
                    spouse: "N Vani ravindra",
                    spouseRole: "Wife",
                    description: "Third son of N P Rangiah Shetty",
                    children: [
                        { name: "Mylavaram Srujana", role: "1st Daughter", description: "First daughter of Ravindranath" },
                        { name: "Sumitha", role: "2nd Daughter", description: "Second daughter of Ravindranath" }
                    ]
                },
                {
                    name: "Rajeshwari",
                    role: "1st Daughter",
                    spouse: "G Ramachandra",
                    spouseRole: "Husband",
                    description: "First daughter of N P Rangiah Shetty",
                    children: [
                        { name: "G Harsha", role: "1st Son", description: "Son of Rajeshwari and G Ramachandra" },
                        { name: "G Kavya", role: "1st Daughter", description: "Daughter of Rajeshwari and G Ramachandra" }
                    ]
                },
                {
                    name: "Radha",
                    role: "2nd Daughter",
                    spouse: "Harapanahalli Krishna Murthy",
                    spouseRole: "Husband",
                    description: "Second daughter of N P Rangiah Shetty",
                    children: [
                        { name: "Aishwaraya Harapanahalli", role: "1st Daughter", description: "Daughter of Radha and Krishna Murthy" },
                        { name: "Supraja Harapanahalli", role: "2nd Daughter", description: "Daughter of Radha and Krishna Murthy" }
                    ]
                },
                {
                    name: "N Raghuram",
                    role: "4th Son",
                    spouse: "N Usha Raghuram",
                    spouseRole: "Wife",
                    description: "Fourth son of N P Rangiah Shetty",
                    children: [
                        {
                            name: "N Sai Prem",
                            role: "1st Son",
                            spouse: "A Sai Harshitha",
                            spouseRole: "Wife",
                            description: "Son of N Raghuram",
                            children: [
                                { name: "Aditya Ram", role: "1st Son", description: "Grandson of N Raghuram" }
                            ]
                        },
                        { name: "N Vivek", role: "2nd Son", description: "Second son of N Raghuram" }
                    ]
                },
                {
                    name: "N Raja Shekar",
                    role: "5th Son",
                    spouse: "N Sreedevi",
                    spouseRole: "Wife",
                    description: "Fifth son of N P Rangiah Shetty",
                    children: [
                        { name: "N Harika", role: "1st Daughter", description: "Daughter of N Raja Shekar" },
                        { name: "N Rahul Shekar", role: "1st Son", description: "Son of N Raja Shekar" }
                    ]
                }
            ]
        };

        // ========== 6.2: HELPER: Create Person Card ==========
        function createPersonCard(name, role, onClickName) {
            return `
                <div class="person-card w-48 h-24 flex-shrink-0 bg-white/5 backdrop-blur-md border border-white/10 rounded-xl flex flex-col items-center justify-center text-white cursor-pointer" onclick="openModal('${onClickName}')">
                    <span class="font-semibold text-sm text-center px-2">${name}</span>
                    <span class="text-[9px] uppercase tracking-[0.2em] text-slate-400 mt-1.5">${role}</span>
                </div>
            `;
        }

        // ========== 6.3: HELPER: Create Couple Connector ==========
        function createCoupleConnector(personName) {
            return `
                <div class="w-12 h-24 flex items-center justify-center relative flex-shrink-0">
                    <div class="absolute w-full h-[2px] bg-[#475569] top-1/2 -translate-y-1/2"></div>
                    <div class="absolute h-1/2 w-[2px] bg-[#475569] bottom-0 left-1/2 -translate-x-1/2"></div>
                    <button class="toggle-btn z-10 w-6 h-6 rounded-full border border-cyan-400 text-cyan-400 bg-[#030014] flex items-center justify-center cursor-pointer transition-colors hover:bg-cyan-400/20" onclick="toggleBranch(this)">
                        <span class="mb-[2px] font-bold text-lg leading-none">-</span>
                    </button>
                </div>
            `;
        }

        // ========== 6.4: RECURSIVE: Render Child Tree ==========
        function renderChildTree(person) {
            let html = '<div class="family-unit flex items-center relative justify-center">';
            
            html += createPersonCard(person.name, person.role, person.name);

            if (person.spouse) {
                html += createCoupleConnector(person.name);
                html += createPersonCard(person.spouse, person.spouseRole, person.spouse);
            }

            html += '</div>';

            if (person.children && person.children.length > 0) {
                html += '<ul>';
                person.children.forEach(child => {
                    html += '<li>' + renderChildTree(child) + '</li>';
                });
                html += '</ul>';
            }

            return html;
        }

        // ========== 6.5: RENDER on DOM Load ==========
        document.addEventListener('DOMContentLoaded', () => {
            const treeRoot = document.getElementById('tree-root');
            
            // Render family-unit for root
            let rootHtml = '<ul><li>';
            rootHtml += '<div class="family-unit flex items-center relative justify-center">';
            rootHtml += createPersonCard(familyData.name, familyData.role, familyData.name);
            rootHtml += createCoupleConnector(familyData.name);
            rootHtml += createPersonCard(familyData.spouse, familyData.spouseRole, familyData.spouse);
            rootHtml += '</div>';

            // Render all children
            if (familyData.children && familyData.children.length > 0) {
                rootHtml += '<ul>';
                familyData.children.forEach(child => {
                    rootHtml += '<li>';
                    rootHtml += renderChildTree(child);
                    rootHtml += '</li>';
                });
                rootHtml += '</ul>';
            }

            rootHtml += '</li></ul>';
            treeRoot.innerHTML = rootHtml;

            // Attach event listeners after rendering
            attachEventListeners();
        });

        // ========== 6.6: EVENT: Attach Listeners ==========
        function attachEventListeners() {
            const toggleBtns = document.querySelectorAll('.toggle-btn');
            toggleBtns.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleBranch(this);
                });
            });
        }

        // ========== 6.7: TOGGLE BRANCH ==========
        function toggleBranch(btn) {
            const li = btn.closest('li');
            let childUl = null;

            for (let i = 0; i < li.children.length; i++) {
                if (li.children[i].tagName.toLowerCase() === 'ul') {
                    childUl = li.children[i];
                    break;
                }
            }

            if (childUl) {
                if (childUl.classList.contains('hidden-tree')) {
                    childUl.classList.remove('hidden-tree');
                    btn.querySelector('span').textContent = '-';
                } else {
                    childUl.classList.add('hidden-tree');
                    btn.querySelector('span').textContent = '+';
                }
            }
        }

        // ========== 6.8: MODAL MANAGEMENT ==========
        const modal = document.getElementById('modal');
        const modalName = document.getElementById('modal-name');
        const modalDescription = document.getElementById('modal-description');

        function openModal(name) {
            // Find person data and display
            const person = findPersonByName(name, familyData);
            if (person) {
                modalName.textContent = name;
                modalDescription.textContent = person.description || "No description available.";
            }
            modal.classList.add('modal-open');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('modal-open');
            document.body.style.overflow = '';
        }

        function findPersonByName(name, person) {
            if (person.name === name || person.spouse === name) return person;
            if (person.children) {
                for (let child of person.children) {
                    const found = findPersonByName(name, child);
                    if (found) return found;
                }
            }
            return null;
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
