<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nagarakanti Family Tree</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030014;
      --line: rgba(148, 163, 184, 0.72);
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #67e8f9;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow-x: auto;
      overflow-y: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    body::-webkit-scrollbar { display: none; }

    body {
      position: relative;
      background:
        radial-gradient(circle at 12% 10%, rgba(59,130,246,0.16), transparent 28%),
        radial-gradient(circle at 86% 84%, rgba(168,85,247,0.16), transparent 32%),
        var(--bg);
    }

    .ambient-glow-1,
    .ambient-glow-2 {
      position: fixed;
      width: 38vw;
      height: 38vw;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.8;
    }

    .ambient-glow-1 {
      top: -12%;
      left: -10%;
      background: rgba(59,130,246,0.18);
    }

    .ambient-glow-2 {
      right: -10%;
      bottom: -12%;
      background: rgba(168,85,247,0.18);
    }

    .page {
      position: relative;
      z-index: 1;
      width: max-content;
      min-width: 100%;
      padding: 52px 30px 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 42px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--cyan);
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .title {
      margin: 0;
      font-size: clamp(2.6rem, 3.5vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      color: #fff;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .tree {
      position: relative;
      z-index: 2;
      width: max-content;
      min-width: 100%;
      display: flex;
      justify-content: center;
    }

    .tree ul,
    .tree li {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tree ul {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      padding-top: 0;
    }

    .tree li {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 18px 0;
    }

    .tree li::before,
    .tree li::after {
      content: "";
      position: absolute;
      top: 0;
      width: 50%;
      height: 2px;
      background: var(--line);
      z-index: 0;
    }

    .tree li::before { right: 50%; }
    .tree li::after { left: 50%; }

    .tree li:first-child::before,
    .tree li:last-child::after { display: none; }
    .tree li:only-child::before,
    .tree li:only-child::after { display: none; }

    .tree > ul > li {
      padding-top: 0;
    }

    .tree > ul > li::before,
    .tree > ul > li::after {
      display: none;
    }

    .family-unit {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      min-height: 110px;
    }

    .family-unit::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      width: 2px;
      height: 30px;
      background: var(--line);
      transform: translateX(-50%);
      z-index: 0;
    }

    .tree > ul > li > .family-unit::before {
      display: none;
    }

    .children {
      position: relative;
      display: flex;
      justify-content: center;
      padding-top: 30px;
    }

    .children::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 2px;
      height: 30px;
      background: var(--line);
      transform: translateX(-50%);
      z-index: 0;
    }

    .collapsed > .children {
      display: none !important;
    }

    .person-card {
      position: relative;
      z-index: 2;
      width: 180px;
      min-width: 180px;
      height: 88px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    }

    .person-card:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.06);
      border-color: rgba(103,232,249,0.35);
    }

    .person-card .name {
      display: block;
      width: 100%;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 600;
      color: #fff;
      word-break: break-word;
    }

    .person-card .role {
      display: block;
      margin-top: 8px;
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.2;
    }

    .couple-connector {
      position: relative;
      z-index: 1;
      width: 84px;
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 2px;
    }

    .couple-connector::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 2px;
      background: var(--line);
      transform: translate(-50%, -50%);
    }

    .couple-connector::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 2px;
      height: 28px;
      background: var(--line);
      transform: translateX(-50%);
    }

    .toggle-btn {
      position: relative;
      z-index: 3;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(103,232,249,0.8);
      background: rgba(3,0,20,0.9);
      color: var(--cyan);
      font-size: 18px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
      padding: 0;
    }

    .toggle-btn:hover {
      background: rgba(103,232,249,0.08);
      transform: scale(1.04);
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 22, 0.8);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 50;
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      position: relative;
      width: min(420px, calc(100vw - 32px));
      padding: 28px 24px 22px;
      border-radius: 20px;
      background: rgba(3, 0, 20, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 40px 80px rgba(2,6,23,0.8);
    }

    .close-btn {
      position: absolute;
      right: 14px;
      top: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(148,163,184,0.2);
      background: rgba(255,255,255,0.03);
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }

    .modal-name {
      margin: 0 0 12px;
      font-size: 26px;
      line-height: 1.2;
      text-align: center;
      color: #fff;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: rgba(103,232,249,0.85);
      margin: 0 auto 18px;
      border-radius: 9999px;
    }

    .modal-text {
      margin: 0;
      text-align: center;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 768px) {
      .page { padding: 30px 16px 64px; }
      .person-card {
        width: 150px;
        min-width: 150px;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <div class="page">
    <header class="header">
      <p class="eyebrow">Lineage &amp; Legacy</p>
      <h1 class="title">Nagarakanti Family</h1>
      <p class="subtitle">Click on any family member to view their information.</p>
    </header>

    <div id="tree" class="tree"></div>
  </div>

  <div id="modal" class="modal" aria-modal="true" role="dialog">
    <div class="modal-card">
      <button class="close-btn" aria-label="Close details" type="button">×</button>
      <h2 id="modal-name" class="modal-name">Name</h2>
      <div class="divider"></div>
      <p id="modal-text" class="modal-text">No details available.</p>
    </div>
  </div>

  <script>
    const familyData = {
      name: "N P Rangiah Shetty",
      role: "Patriarch",
      spouse: { name: "N Varalakshamma", role: "Matriarch" },
      description: "Patriarch of the Nagarakanti family.",
      children: [
        {
          name: "N Ranganath Gupta",
          role: "1st Son",
          spouse: { name: "N Sathyavathi", role: "Wife" },
          description: "First son of N P Rangiah Shetty and N Varalakshamma.",
          children: [
            { name: "Kiranmai Ragalatha", role: "1st Daughter", description: "First daughter of N Ranganath Gupta and N Sathyavathi." },
            { name: "Rajeev Chandra", role: "1st Son", description: "First son of N Ranganath Gupta and N Sathyavathi." }
          ]
        },
        {
          name: "N Rama Krishna",
          role: "2nd Son",
          spouse: { name: "Kalpana", role: "Wife" },
          description: "Second son of N P Rangiah Shetty and N Varalakshamma.",
          children: [
            { name: "Nilima Dhavala", role: "1st Daughter", description: "First daughter of N Rama Krishna and Kalpana." },
            { name: "Rakhi", role: "2nd Daughter", description: "Second daughter of N Rama Krishna and Kalpana." }
          ]
        },
        {
          name: "N Ravindranath",
          role: "3rd Son",
          spouse: { name: "N Vani Ravindra", role: "Wife" },
          description: "Third son of N P Rangiah Shetty and N Varalakshamma.",
          children: [
            { name: "Mylavaram Srujana", role: "1st Daughter", description: "First daughter of N Ravindranath and N Vani Ravindra." },
            { name: "Sumitha", role: "2nd Daughter", description: "Second daughter of N Ravindranath and N Vani Ravindra." }
          ]
        },
        {
          name: "Rajeshwari",
          role: "1st Daughter",
          spouse: { name: "G Ramachandra", role: "Husband" },
          description: "First daughter of N P Rangiah Shetty and N Varalakshamma.",
          children: [
            { name: "G Harsha", role: "1st Son", description: "Son of Rajeshwari and G Ramachandra." },
            { name: "G Kavya", role: "1st Daughter", description: "Daughter of Rajeshwari and G Ramachandra." }
          ]
        },
        {
          name: "Radha",
          role: "2nd Daughter",
          spouse: { name: "Harapanahalli Krishna Murthy", role: "Husband" },
          description: "Second daughter of N P Rangiah Shetty and N Varalakshamma.",
          children: [
            { name: "Aishwaraya Harapanahalli", role: "1st Daughter", description: "Daughter of Radha and Harapanahalli Krishna Murthy." },
            { name: "Supraja Harapanahalli", role: "2nd Daughter", description: "Daughter of Radha and Harapanahalli Krishna Murthy." }
          ]
        },
        {
          name: "N Raghuram",
          role: "4th Son",
          spouse: { name: "N Usha Raghuram", role: "Wife" },
          description: "Fourth son of N P Rangiah Shetty and N Varalakshamma.",
          children: [
            {
              name: "N Sai Prem",
              role: "1st Son",
              spouse: { name: "A Sai Harshitha", role: "Wife" },
              description: "Son of N Raghuram and N Usha Raghuram.",
              children: [
                { name: "Aditya Ram", role: "1st Son", description: "Son of N Sai Prem and A Sai Harshitha." }
              ]
            },
            { name: "N Vivek", role: "2nd Son", description: "Second son of N Raghuram and N Usha Raghuram." }
          ]
        },
        {
          name: "N Raja Shekar",
          role: "5th Son",
          spouse: { name: "N Sreedevi", role: "Wife" },
          description: "Fifth son of N P Rangiah Shetty and N Varalakshamma.",
          children: [
            { name: "N Harika", role: "1st Daughter", description: "Daughter of N Raja Shekar and N Sreedevi." },
            { name: "N Rahul Shekar", role: "1st Son", description: "Son of N Raja Shekar and N Sreedevi." }
          ]
        }
      ]
    };

    const modal = document.getElementById('modal');
    const modalName = document.getElementById('modal-name');
    const modalText = document.getElementById('modal-text');
    const closeBtn = document.querySelector('.close-btn');
    const collapsed = new Set();

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function cardMarkup(person) {
      return `
        <div class="person-card" data-name="${escapeHtml(person.name)}" data-desc="${escapeHtml(person.description || '')}">
          <span class="name">${escapeHtml(person.name)}</span>
          <span class="role">${escapeHtml(person.role || '')}</span>
        </div>
      `;
    }

    function coupleConnectorMarkup(person) {
      const hasChildren = Array.isArray(person.children) && person.children.length > 0;
      const isOpen = !collapsed.has(person.name);
      return `
        <div class="couple-connector">
          ${hasChildren ? `<button class="toggle-btn" type="button" data-name="${escapeHtml(person.name)}">${isOpen ? '-' : '+'}</button>` : ''}
        </div>
      `;
    }

    function renderPerson(person) {
      const hasChildren = Array.isArray(person.children) && person.children.length > 0;
      const nodeClass = hasChildren && collapsed.has(person.name) ? 'collapsed' : '';

      return `
        <li class="${nodeClass}">
          <div class="family-unit">
            ${cardMarkup(person)}
            ${person.spouse ? coupleConnectorMarkup(person) : ''}
            ${person.spouse ? cardMarkup(person.spouse) : ''}
          </div>
          ${hasChildren ? `
            <ul class="children">
              ${person.children.map(child => renderPerson(child)).join('')}
            </ul>
          ` : ''}
        </li>
      `;
    }

    function renderTree() {
      const root = document.getElementById('tree');
      root.innerHTML = `
        <ul>
          ${renderPerson(familyData)}
        </ul>
      `;
      bindClickEvents();
      bindToggleEvents();
    }

    function bindClickEvents() {
      document.querySelectorAll('.person-card').forEach(card => {
        card.addEventListener('click', () => {
          const name = card.dataset.name;
          const desc = card.dataset.desc || 'No details available.';
          modalName.textContent = name;
          modalText.textContent = desc;
          modal.classList.add('open');
          document.body.style.overflow = 'hidden';
        });
      });
    }

    function bindToggleEvents() {
      document.querySelectorAll('.toggle-btn').forEach(btn => {
        btn.addEventListener('click', (event) => {
          event.stopPropagation();
          const nodeName = btn.dataset.name;
          const parentLi = btn.closest('li');

          if (collapsed.has(nodeName)) {
            collapsed.delete(nodeName);
            btn.textContent = '-';
            parentLi.classList.remove('collapsed');
          } else {
            collapsed.add(nodeName);
            btn.textContent = '+';
            parentLi.classList.add('collapsed');
          }
        });
      });
    }

    function closeModal() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (event) => {
      if (event.target === modal) closeModal();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && modal.classList.contains('open')) {
        closeModal();
      }
    });

    renderTree();
  </script>
</body>
</html>
