<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nagarakanti Family Tree</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030014;
      --panel: rgba(15, 23, 42, 0.38);
      --panel-border: rgba(148, 163, 184, 0.18);
      --line: rgba(148, 163, 184, 0.7);
      --line-soft: rgba(148, 163, 184, 0.5);
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #67e8f9;
      --cyan-strong: #22d3ee;
      --magenta: rgba(168, 85, 247, 0.25);
      --blue: rgba(59, 130, 246, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow-x: auto;
      overflow-y: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    body::-webkit-scrollbar { display: none; }

    body {
      position: relative;
      background:
        radial-gradient(circle at 10% 10%, rgba(59,130,246,0.18), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(168,85,247,0.18), transparent 35%),
        var(--bg);
    }

    .ambient-glow-one,
    .ambient-glow-two {
      position: fixed;
      border-radius: 9999px;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.9;
    }

    .ambient-glow-one {
      width: 40vw;
      height: 40vw;
      top: -10%;
      left: -10%;
      background: rgba(59, 130, 246, 0.18);
    }

    .ambient-glow-two {
      width: 35vw;
      height: 35vw;
      bottom: -10%;
      right: -10%;
      background: rgba(168, 85, 247, 0.18);
    }

    .page {
      position: relative;
      z-index: 1;
      width: max-content;
      min-width: 100%;
      padding: 56px 32px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 0.30em;
      color: var(--cyan);
      text-transform: uppercase;
      font-weight: 700;
      margin: 0 0 10px;
    }

    .title {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      color: #fff;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .tree {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      width: max-content;
      min-width: 100%;
    }

    .tree ul,
    .tree li {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tree ul {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 30px;
    }

    .tree > ul { padding-top: 0; }

    .tree li {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 26px 14px 0;
    }

    .tree li::before,
    .tree li::after {
      content: "";
      position: absolute;
      top: 0;
      width: 50%;
      height: 2px;
      background: var(--line);
      z-index: 0;
    }

    .tree li::before { left: 0; }
    .tree li::after { right: 0; }

    .tree li:first-child::before,
    .tree li:last-child::after { display: none; }
    .tree li:only-child::before,
    .tree li:only-child::after { display: none; }

    .tree-node {
      position: relative;
      z-index: 1;
    }

    .family-node {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
    }

    .family-node::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -30px;
      width: 2px;
      height: 30px;
      background: var(--line);
      transform: translateX(-50%);
      z-index: 0;
    }

    .tree > ul > li > .family-node::before { display: none; }

    .family-pair {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .member-card {
      position: relative;
      z-index: 2;
      width: 182px;
      min-width: 182px;
      height: 90px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
      transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
      cursor: pointer;
    }

    .member-card:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.06);
      border-color: rgba(103,232,249,0.35);
    }

    .member-card .name {
      display: block;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 600;
      color: #fff;
      width: 100%;
      word-break: break-word;
    }

    .member-card .role {
      display: block;
      margin-top: 9px;
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.2;
    }

    .couple-connector {
      position: relative;
      z-index: 1;
      width: 84px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 2px;
    }

    .couple-connector::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 2px;
      transform: translate(-50%, -50%);
      background: var(--line);
    }

    .couple-connector.has-children::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 2px;
      height: 42px;
      background: var(--line);
      transform: translateX(-50%);
    }

    .toggle-btn {
      position: relative;
      z-index: 3;
      width: 26px;
      height: 26px;
      border-radius: 9999px;
      border: 1px solid rgba(103,232,249,0.8);
      background: rgba(3,0,20,0.9);
      color: var(--cyan);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .toggle-btn:hover {
      background: rgba(103,232,249,0.08);
      transform: scale(1.04);
    }

    .tree-children {
      position: relative;
      display: flex;
      justify-content: center;
      padding-top: 30px;
    }

    .tree-children::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 2px;
      height: 30px;
      background: var(--line);
      transform: translateX(-50%);
      z-index: 0;
    }

    .tree-node.collapsed > .tree-children {
      display: none !important;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 22, 0.8);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 50;
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      position: relative;
      width: min(420px, calc(100vw - 32px));
      padding: 28px 24px 22px;
      border-radius: 20px;
      background: rgba(3, 0, 20, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 40px 80px rgba(2,6,23,0.8);
    }

    .close-btn {
      position: absolute;
      right: 14px;
      top: 14px;
      width: 32px;
      height: 32px;
      border-radius: 9999px;
      border: 1px solid rgba(148,163,184,0.2);
      background: rgba(255,255,255,0.03);
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }

    .modal-name {
      margin: 0 0 12px;
      font-size: 26px;
      line-height: 1.2;
      text-align: center;
      color: #fff;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: rgba(103,232,249,0.85);
      margin: 0 auto 18px;
      border-radius: 9999px;
    }

    .modal-text {
      margin: 0;
      text-align: center;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 768px) {
      .page { padding: 32px 16px 64px; }
      .member-card {
        width: 150px;
        min-width: 150px;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-glow-one"></div>
  <div class="ambient-glow-two"></div>

  <div class="page">
    <header class="header">
      <p class="eyebrow">Lineage &amp; Legacy</p>
      <h1 class="title">Nagarakanti Family</h1>
      <p class="subtitle">Click on any family member to view their information.</p>
    </header>

    <div id="tree" class="tree"></div>
  </div>

  <div id="modal" class="modal" aria-modal="true" role="dialog">
    <div class="modal-card">
      <button class="close-btn" aria-label="Close details" type="button">×</button>
      <h2 id="modal-name" class="modal-name">Name</h2>
      <div class="divider"></div>
      <p id="modal-text" class="modal-text">No details available.</p>
    </div>
  </div>

  <script>
    const modal = document.getElementById('modal');
    const modalName = document.getElementById('modal-name');
    const modalText = document.getElementById('modal-text');
    const closeBtn = document.querySelector('.close-btn');
    const collapsed = new Set();

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function personCard(person) {
      return `
        <div class="member-card" data-name="${escapeHtml(person.name)}" data-desc="${escapeHtml(person.description || '')}">
          <span class="name">${escapeHtml(person.name)}</span>
          <span class="role">${escapeHtml(person.role || '')}</span>
        </div>
      `;
    }

    function coupleConnector(person) {
      const hasChildren = Array.isArray(person.children) && person.children.length > 0;
      const expanded = !collapsed.has(person.id);
      const connectorClass = hasChildren ? 'has-children' : '';
      const toggle = hasChildren
        ? `<button class="toggle-btn" type="button" data-id="${person.id}">${expanded ? '-' : '+'}</button>`
        : '';

      return `
        <div class="couple-connector ${connectorClass}">
          ${toggle}
        </div>
      `;
    }

    function renderMember(person) {
      const hasChildren = Array.isArray(person.children) && person.children.length > 0;
      const isCollapsed = hasChildren && collapsed.has(person.id);
      const pairMarkup = person.spouse
        ? `
          <div class="family-pair">
            ${personCard(person)}
            ${coupleConnector(person)}
            ${personCard(person.spouse)}
          </div>
        `
        : `
          <div class="family-pair">
            ${personCard(person)}
          </div>
        `;

      const childMarkup = hasChildren
        ? `<ul class="tree-children">${person.children.map(child => `<li>${renderMember(child)}</li>`).join('')}</ul>`
        : '';

      return `
        <li class="tree-node ${isCollapsed ? 'collapsed' : ''}">
          <div class="family-node">${pairMarkup}</div>
          ${childMarkup}
        </li>
      `;
    }

    function renderTree(data) {
      const root = document.getElementById('tree');
      root.innerHTML = `
        <ul>
          <li>
            ${renderMember(data.familyTree)}
          </li>
        </ul>
      `;

      bindMemberClicks();
      bindToggleButtons();
    }

    function bindMemberClicks() {
      document.querySelectorAll('.member-card').forEach(card => {
        card.addEventListener('click', () => {
          const name = card.dataset.name;
          const desc = card.dataset.desc || 'No details available.';
          modalName.textContent = name;
          modalText.textContent = desc;
          modal.classList.add('open');
          document.body.style.overflow = 'hidden';
        });
      });
    }

    function bindToggleButtons() {
      document.querySelectorAll('.toggle-btn').forEach(btn => {
        btn.addEventListener('click', (event) => {
          event.stopPropagation();
          const id = btn.dataset.id;
          const target = btn.closest('.tree-node');
          if (!target) return;

          if (collapsed.has(id)) {
            collapsed.delete(id);
            btn.textContent = '-';
            target.classList.remove('collapsed');
          } else {
            collapsed.add(id);
            btn.textContent = '+';
            target.classList.add('collapsed');
          }
        });
      });
    }

    function closeModal() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (event) => {
      if (event.target === modal) closeModal();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && modal.classList.contains('open')) {
        closeModal();
      }
    });

    fetch('family-data.json')
      .then(response => response.ok ? response.json() : Promise.reject(new Error('Failed to load family data')))
      .then(data => renderTree(data))
      .catch(error => {
        console.error(error);
        document.getElementById('tree').innerHTML = '<p style="color: white; padding: 20px;">Unable to load family data.</p>';
      });
  </script>
</body>
</html>
